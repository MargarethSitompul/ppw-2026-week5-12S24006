openapi: 3.0.3
info:
  title: SIPUS-Del Library RESTful Web API
  version: 1.0.0
  description: >
    Kontrak resmi layanan REST API Sistem Informasi Perpustakaan IT Del (Minggu 9 PPW).
    Mematuhi Richardson Maturity Model Level 3 (HATEOAS) & RFC 7807 Problem Details.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Masukkan access_token hasil login dari endpoint POST /auth/login
  schemas:
    BukuInput:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, kategori_id, stok]
      properties:
        isbn: { type: string, example: "9780000000099" }
        judul: { type: string, example: "Pemrograman Web Lanjutan" }
        penulis: { type: string, example: "Chandro Pardede" }
        penerbit: { type: string, example: "Del Press" }
        tahun_terbit: { type: integer, example: 2026 }
        kategori_id: { type: integer, example: 1 }
        stok: { type: integer, minimum: 0, example: 10 }
        sinopsis: { type: string, nullable: true }
    PeminjamanInput:
      type: object
      required: [buku_id, nim_peminjam, nama_peminjam]
      properties:
        buku_id: { type: integer, example: 3 }
        nim_peminjam: { type: string, example: "12S24006" }
        nama_peminjam: { type: string, example: "Nama Mahasiswa" }
        durasi_hari: { type: integer, example: 7 }
    ProblemDetails:
      type: object
      properties:
        type: { type: string, example: "http://localhost:8000/docs/errors/validation-failed" }
        title: { type: string, example: "Unprocessable Content" }
        status: { type: integer, example: 422 }
        detail: { type: string }
        instance: { type: string, example: "/api/v1/bukus" }

paths:
  /auth/login:
    post:
      summary: Menerbitkan Stateless Bearer Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Login berhasil & mengembalikan access_token }
        '401':
          description: Kredensial tidak valid
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /auth/me:
    get:
      summary: Profil pemilik token aktif
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Profil ditemukan }
        '401': { description: Token tidak valid / tidak dilampirkan }

  /auth/logout:
    post:
      summary: Mencabut (revoke) token yang sedang dipakai
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Token berhasil dicabut }

  /bukus:
    get:
      summary: Daftar buku (mendukung search, filter kategori, filter ketersediaan, sort, pagination)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: kategori_id, in: query, schema: { type: integer } }
        - { name: tersedia, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: dir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: per_page, in: query, schema: { type: integer, default: 5 } }
      responses:
        '200': { description: Koleksi buku terpaginasi }
    post:
      summary: Menambah buku baru
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuInput' }
      responses:
        '201': { description: Buku berhasil dibuat (beserta Header Location) }
        '401': { description: Belum melampirkan Bearer Token }
        '422':
          description: Gagal validasi input
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /bukus/{id}:
    get:
      summary: Detail satu buku beserta kategori, riwayat peminjaman & link HATEOAS
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Detail ditemukan }
        '404':
          description: Buku tidak ditemukan
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
    put:
      summary: Mengganti seluruh atribut buku (Full Replacement)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BukuInput' }
      responses:
        '200': { description: Seluruh data diganti }
    patch:
      summary: Mengubah sebagian atribut buku (Partial Update)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Sebagian atribut diperbarui }
    delete:
      summary: Menghapus buku (ditolak 409 jika masih ada peminjaman aktif)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Berhasil dihapus tanpa body }
        '409':
          description: Konflik — buku masih dipinjam
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /bukus/{id}/referensi-eksternal:
    get:
      summary: Mengambil metadata tambahan buku dari OpenLibrary API (REST Service Consumer)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Referensi eksternal berhasil diambil (atau tidak ditemukan) }
        '502': { description: Layanan eksternal tidak dapat dihubungi }

  /peminjamans:
    get:
      summary: Daftar transaksi peminjaman (filter status & nim)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [dipinjam, dikembalikan] } }
        - { name: nim, in: query, schema: { type: string } }
      responses:
        '200': { description: Daftar peminjaman terpaginasi }
    post:
      summary: Mencatat peminjaman buku baru (transaksi ACID + lockForUpdate)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeminjamanInput' }
      responses:
        '201': { description: Peminjaman berhasil dicatat (beserta Header Location) }
        '409':
          description: Konflik — mahasiswa masih punya pinjaman aktif atas buku ini
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422':
          description: Stok buku habis
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /peminjamans/{id}/kembalikan:
    patch:
      summary: Mengembalikan buku (transaksi ACID + lockForUpdate)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Buku berhasil dikembalikan, stok bertambah }
        '409':
          description: Konflik — peminjaman sudah berstatus dikembalikan
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
